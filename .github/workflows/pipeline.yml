name: Build and publish image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  packages: write
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, build, links, CSP check
        run: npm run build

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Visual baselines are recorded on macOS and reviewed by a human; Linux
      # rasterises fonts differently, so they are not asserted here.
      - name: E2E, accessibility, search and i18n
        run: npx playwright test --grep-invert visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-and-push-image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit timestamp (sortable tag for Flux image automation)
        id: ts
        run: echo "value=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # main-<timestamp>-<sha> is what bb-infrastructure's Flux ImagePolicy orders on
          # (numerical by commit time, so re-runs cannot outrank newer commits); the bare sha stays for humans.
          tags: |
            ghcr.io/binary-bridges-co/bb-docs:latest
            ghcr.io/binary-bridges-co/bb-docs:${{ github.sha }}
            ghcr.io/binary-bridges-co/bb-docs:main-${{ steps.ts.outputs.value }}-${{ github.sha }}
