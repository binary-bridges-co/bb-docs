# Static server for the Astro + Starlight build.
#
# Listens on 3000 like the homepage image: bb-infrastructure's Service and
# Ingress for every static site point at that port, and the Dockerfile's
# HEALTHCHECK and tests/unit/deploy-contract.test.ts assert it.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Behind Traefik, nginx sees plain HTTP on :3000. Absolute redirects would
    # send visitors to http://docs.binarybridges.co:3000/...; relative Location
    # headers resolve against the real https host instead.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/manifest+json application/json application/wasm;
    gzip_vary on;

    # Security headers. `always` so 404s carry them too. Headers declared in a
    # location block REPLACE these, so every location that adds a header
    # includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted by Astro: safe to cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pagefind's index is rebuilt on every deploy and not fingerprinted: a short cache.
    location /pagefind/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
