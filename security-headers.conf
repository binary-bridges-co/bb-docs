# Included by every location in nginx.conf (see the note there).
#
# script-src: 'self' plus the sha256 of each inline script Starlight emits
# (theme provider, picker sync, search modal, sidebar state, the OpenAPI
# snippets element, the Tabs restore element). `npm run check:csp` fails the build if they drift: run it
# and paste the hashes it prints. style-src needs 'unsafe-inline': Astro and
# Starlight emit style attributes. No user content is ever rendered, so this
# is not an injection vector. Pagefind loads its WASM from /pagefind/ on the
# same origin; 'wasm-unsafe-eval' lets Chromium instantiate it under this CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-7eCV4jtsr4t4knb3c4FCRPeu7GGZeOUGE3XvWix0XOQ=' 'sha256-D2mXktIYWRISw7Qt6bbptLqLWrXKB6tbwhGnB3lS2YM=' 'sha256-f/zAUE74ucc3JYp4r4QQvkJofoQdkOIhHYK+jeZ6eko=' 'sha256-GkZBRnvSuhtx/cvzvukVkX2JJZW+DdPlVr7BX8Tefqo=' 'sha256-VWo5Wp4aqSj6nSgMpeAp9cKieaoIfwFUAunAVugI5gA=' 'sha256-wX2yOADeV+NMngflD5uYi3vl50SHC4sfM1EmylVjlX4=' 'sha256-OizSKqsU+f0G4vojbxNt0Lao3kUpTmCLQSv3y6P7qhQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
